services:
  fortiflex-chargeback:
    build: .
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8088}:8088"
    environment:
      APP_DB_PATH: /app/demo/runtime.db
      APP_SECRETS_PATH: /app/demo/connection.json
      CURRENCY_RATE: ${CURRENCY_RATE:-}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-}
    volumes:
      - ./demo:/app/demo
      - ${TLS_DIRECTORY:-./certs}:/certs:ro
    restart: unless-stopped
